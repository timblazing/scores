# Added by proj (Set up agents). Runs Claude Code when timblazing mentions @claude.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.event.sender.login == 'timblazing' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'anton-jit' }}
    env:
      # Optional. proj sets this secret when anton has the key; without it Claude runs without Composio.
      COMPOSIO_CONSUMER_API_KEY: ${{ secrets.COMPOSIO_CONSUMER_API_KEY }}
      # Inline JSON, not a file: claude-code-action drops --mcp-config file paths. Claude Code expands the
      # ${VAR} header itself, so the key never appears in the arguments.
      COMPOSIO_ARGS: >-
        --mcp-config '{"mcpServers":{"composio":{"type":"http","url":"https://connect.composio.dev/mcp","headers":{"x-consumer-api-key":"${COMPOSIO_CONSUMER_API_KEY}"}}}}'
        --allowedTools mcp__composio
        --append-system-prompt "The composio MCP server reaches external apps such as Gmail, Slack, Notion or Linear. Find a tool with COMPOSIO_SEARCH_TOOLS, then run it with COMPOSIO_MULTI_EXECUTE_TOOL. Read freely; write to an external app (send, post, create, delete) only when the task asks for that write."
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Links the skills into ~/.claude/skills and ~/.agents/skills. Pulls instead of cloning when
      # HOME already has them (a persistent self-hosted runner; anton-jit jobs get a fresh HOME).
      - name: Install skills
        run: |
          if [ -d "$HOME/skills/.git" ]; then git -C "$HOME/skills" pull --ff-only; else git clone --depth 1 https://github.com/timblazing/skills "$HOME/skills"; fi
          "$HOME/skills/install.sh"

      # pnpm/yarn ship through corepack; ubuntu-latest has Node but not pnpm on PATH.
      - name: Enable corepack
        run: corepack enable || true

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: ${{ env.COMPOSIO_CONSUMER_API_KEY != '' && env.COMPOSIO_ARGS || '' }}
